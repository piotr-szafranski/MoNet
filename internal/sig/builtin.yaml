# Wbudowane sygnatury MoNet. Tylko bezpieczna detekcja: dopasowania do odpowiedzi i GET na ścieżki (bez logowania).
# Pewność = suma wag dopasowanych matcherów (max 100%). Grupa (?P<version>...) wyciąga wersję.

# ---------- CMS ----------
- id: wordpress
  name: WordPress
  category: cms
  interest: 15
  matchers:
    - {type: body, regex: '/wp-(content|includes)/', weight: 0.6}
    - {type: body, regex: '<meta name="generator" content="WordPress ?(?P<version>[\d.]+)?', weight: 0.9}
    - {type: header, name: link, regex: 'wp-json', weight: 0.6}
    - {type: cookie, name: '^wordpress_|^wp-settings', weight: 0.6}
    - {type: path, path: /wp-login.php, status: [200], regex: 'wp-submit|user_login', weight: 0.7}
    - {type: body, regex: 'wp-admin/css/install[^"'']*\?ver=(?P<version>\d+\.\d+(\.\d+)?)', weight: 0.5}  # strona instalacji (lab AGH vulnerable)
- id: joomla
  name: Joomla
  category: cms
  interest: 15
  matchers:
    - {type: body, regex: '<meta name="generator" content="Joomla!?(?: - Open Source Content Management)?', weight: 0.9}
    - {type: body, regex: '/media/(jui|system)/js/|/components/com_', weight: 0.5}
    - {type: path, path: /administrator/, status: [200], regex: 'Joomla|mod-login', weight: 0.7}
    - {type: header, name: x-content-encoded-by, regex: 'Joomla', weight: 0.8}
- id: drupal
  name: Drupal
  category: cms
  interest: 15
  matchers:
    - {type: header, name: x-generator, regex: 'Drupal ?(?P<version>\d+)?', weight: 0.9}
    - {type: header, name: x-drupal-cache, weight: 0.8}
    - {type: header, name: x-drupal-dynamic-cache, weight: 0.8}
    - {type: body, regex: '<meta name="Generator" content="Drupal ?(?P<version>\d+)?', weight: 0.9}
    - {type: body, regex: '/sites/(default|all)/(files|modules|themes)/|drupalSettings', weight: 0.5}
- id: typo3
  name: TYPO3
  category: cms
  interest: 10
  matchers:
    - {type: body, regex: '<meta name="generator" content="TYPO3 CMS', weight: 0.9}
    - {type: body, regex: '/typo3(conf|temp)/', weight: 0.5}
- id: moodle
  name: Moodle
  category: cms
  interest: 10
  matchers:
    - {type: cookie, name: '^MoodleSession', weight: 0.9}
    - {type: body, regex: 'moodle-|M\.cfg = |/theme/styles\.php', weight: 0.5}
- id: magento
  name: Magento
  category: cms
  interest: 10
  matchers:
    - {type: body, regex: 'Mage\.Cookies|/static/version\d+/frontend/|mage/cookies', weight: 0.7}
    - {type: cookie, name: '^frontend$|^mage-', weight: 0.5}
- id: mediawiki
  name: MediaWiki
  category: cms
  interest: 5
  matchers:
    - {type: body, regex: '<meta name="generator" content="MediaWiki (?P<version>[\d.]+)', weight: 0.9}
